name: Bug report
description: Report a reproducible problem in PaperLite.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private information from any PDF or screenshot you attach.
  - type: input
    id: version
    attributes:
      label: PaperLite version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the steps that reproduce the problem and what you expected instead.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add safe screenshots or details about the PDF type if helpful.
