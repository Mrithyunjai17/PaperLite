[package]
name = "paperlite"
version = "0.1.0"
description = "A small, private, offline PDF reader and annotator"
authors = ["Mrithyunjai17"]
license = "MIT"
edition = "2021"

[lib]
name = "paperlite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
